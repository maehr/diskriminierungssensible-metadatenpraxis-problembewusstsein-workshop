# Lychee configuration for link checking
# https://lychee.cli.rs/guides/config/

# The site does not exist before the first deployment.
# Sites that block automated requests produce false errors.
exclude = [
  "^https://maehr\\.github\\.io/diskriminierungssensible-metadatenpraxis-problembewusstsein-workshop",
  "^https://github\\.com/maehr/diskriminierungssensible-metadatenpraxis-problembewusstsein-workshop",
  "^https://dls\\.staatsarchiv\\.bs\\.ch/",
  "^https://www\\.contributor-covenant\\.org/faq",
  # gnu.org and fsf.org time out for GitHub runners.
  "^https://(www\\.)?gnu\\.org/",
  "^https://(www\\.)?fsf\\.org/",
  # ACM and BMJ answer automated DOI requests with 403.
  "^https://doi\\.org/10\\.(1145|1136)/",
]

# Local links to rendered files (PDF, DOCX, HTML) exist only in _site/.
# The licence texts are legal documents. Do not check their links.
exclude_path = ["_site", "node_modules", ".venv", "SPECS.md", "LICENSE-AGPL.md", "LICENSE-CCBYSA.md"]
scheme = ["https", "http"]

timeout = 20
max_retries = 2
format = "compact"
no_progress = true
cache = true
max_cache_age = "7d"
accept = ["100..=103", "200..=299", "429"]
