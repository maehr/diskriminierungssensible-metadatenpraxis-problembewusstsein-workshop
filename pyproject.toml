[project]
name = "diskriminierungssensible-metadatenpraxis-problembewusstsein-workshop"
version = "0.1.0"
description = "OER für einen Hands-on-Kurs zu diskriminierungssensibler Metadatenpraxis"
authors = [{ name = "Moritz Mähr" }, { name = "Noëlle Schnegg" }]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "commitizen==4.19.2",
    "ruff==0.17.0",
    "ty==0.0.86",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_files = ["CITATION.cff:^version"]
update_changelog_on_bump = false
major_version_zero = true
