title: OER-Druckvorlage
author: Moritz Mähr
version: 0.2.0
quarto-required: '>=1.10.0'
contributes:
  formats:
    # PDF: Typst with the slide typography (template partials) and writing fields.
    typst:
      papersize: a4
      margin:
        x: 2cm
        y: 1.8cm
      fontsize: 10pt
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - schreibfelder.lua
    # DOCX: editable worksheets with writing fields.
    docx:
      filters:
        - schreibfelder.lua
