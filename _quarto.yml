          - text: Vorbereitung
            href: kurs/vorbereitung.qmd
          - text: Ablauf 60 Minuten
            href: kurs/ablauf-60.qmd
          - text: Ablauf 75 Minuten
            href: kurs/ablauf-75.qmd
          - text: Ablauf 90 Minuten
            href: kurs/ablauf-90.qmd
          - text: Hinweise für Kursleitende
            href: kurs/moderation.qmd
          - text: Content Note
            href: kurs/content-note.qmd
          - text: Hinweise zu den Fallkarten
            href: kurs/hinweise-fallkarten.qmd
      - section: Input
        contents:
          - text: Slides
            href: input/slides.qmd
          - text: Video
            href: input/video.qmd
          - text: Transkript des Videos
            href: input/transkript.qmd
          - text: Kernkonzepte
            href: input/kernkonzepte.qmd
      - section: Hands-on
        contents:
          - text: Metadaten-Audit
            href: hands-on/metadaten-audit.qmd
          - text: Eigenes Beispiel verwenden
            href: hands-on/eigenes-beispiel.qmd
          - section: Fallbeispiele
            href: hands-on/fallbeispiele/index.qmd
            contents:
              - hands-on/fallbeispiele/fall-1-kontextualisierung.qmd
              - hands-on/fallbeispiele/fall-2-historische-bezeichnung.qmd
              - hands-on/fallbeispiele/fall-3-normdaten.qmd
              - hands-on/fallbeispiele/fall-4-datenmodell.qmd
              - hands-on/fallbeispiele/fall-5-sensible-inhalte.qmd
      - text: Arbeitshilfen
