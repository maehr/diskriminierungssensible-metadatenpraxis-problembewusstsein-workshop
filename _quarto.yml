project:
  type: website
  render:
    - index.qmd
    - kurs/*.qmd
    - input/*.qmd
    - slides/folien.qmd
    - hands-on/**/*.qmd
    - arbeitshilfen/*.qmd
    - nach-dem-kurs/*.qmd
    - oer/*.qmd
  resources:
    - slides/folien.pdf
    - assets/video/input.mp4
    - assets/video/kapitel.vtt
    - assets/video/poster.jpg

lang: de
# Every page is a draft until the author review. Set entwurf: false per page after the review.
entwurf: true

website:
  title: Diskriminierungssensible Metadatenpraxis
  description: >-
    Open Educational Resource für einen 60- bis 90-minütigen Hands-on-Kurs:
    Problembewusstsein für Diskriminierung in und durch Daten und Metadaten schaffen.
  site-url: https://maehr.github.io/diskriminierungssensible-metadatenpraxis-problembewusstsein-workshop/
  repo-url: https://github.com/maehr/diskriminierungssensible-metadatenpraxis-problembewusstsein-workshop
  repo-actions: [edit, issue]
  favicon: assets/favicon.svg
  open-graph: true
  page-navigation: true
  bread-crumbs: false
  back-to-top-navigation: true
  search:
    type: overlay
    show-item-context: true
  navbar:
    left:
      - text: Für Kursleitende
        href: kurs/index.qmd
      - text: Für Teilnehmende
        href: hands-on/metadaten-audit.qmd
    right:
      - text: Handbuch
        href: https://moritz-maehr.quarto.pub/diskriminierungssensible-metadatenpraxis/
      - icon: github
        href: https://github.com/maehr/diskriminierungssensible-metadatenpraxis-problembewusstsein-workshop
        aria-label: GitHub-Repository
  sidebar:
    style: docked
    contents:
      - text: Start
        href: index.qmd
      - section: Kurs durchführen
        contents:
          - text: Lernziele und Überblick
