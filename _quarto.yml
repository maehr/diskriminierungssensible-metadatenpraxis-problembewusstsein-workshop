      - section: Nach dem Kurs
        contents:
          - text: Transfer
            href: nach-dem-kurs/transfer.qmd
          - text: Weiterführende Lektüre
            href: nach-dem-kurs/lektuere.qmd
          - text: Handbuch
            href: https://moritz-maehr.quarto.pub/diskriminierungssensible-metadatenpraxis/
      - section: OER verwenden
        contents:
