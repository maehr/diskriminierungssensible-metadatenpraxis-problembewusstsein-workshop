<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 800 540" role="img" aria-labelledby="dg17-t dg17-d" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<title id="dg17-t">Verhaltensverzerrung: zwei Gruppen suchen unterschiedlich</title>
<desc id="dg17-d">Historiker*innen suchen systematisch über Bestand, Serie und Dossier oder über Signaturen. Lai*innen suchen nach Familiennamen und spektakulären Ereignissen. Die Zugriffszahlen sind deshalb bei Familiennamen und Ereignissen hoch und bei Verwaltungsserien niedrig (schematisch).</desc>
