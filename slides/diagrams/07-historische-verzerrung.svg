<title id="dg07-t">Historische Verzerrung: korrekte Daten einer ungleichen Vergangenheit</title>
<desc id="dg07-d">Links eine historische Gesellschaft mit acht Männern und einer Frau in Führungspositionen. Über Quellen mit perfekter Stichprobe entsteht rechts ein Datensatz mit demselben Verhältnis. Die Daten sind korrekt; die Ungleichheit liegt in der Geschichte.</desc>
