<text x="0" y="512" font-size="24" font-weight="400" text-anchor="start"><tspan fill="#8A6422" font-weight="700">Eine Sprache</tspan><tspan fill="#24303A" font-weight="400"> bestimmt Begriffe, Struktur und Sichtbarkeit</tspan></text>
