<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 800 530" role="img" aria-labelledby="dg19-t dg19-d" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<title id="dg19-t">Inhaltsproduktionsfehler: Beiträge nach Sprache</title>
