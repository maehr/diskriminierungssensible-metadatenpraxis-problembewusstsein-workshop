<text x="0" y="314" font-size="22" font-weight="400" fill="#24303A" text-anchor="start">Spanisch</text>
<path d="M170,288 L194.0,288 Q198.0,288 198.0,292 L198.0,324 Q198.0,328 194.0,328 L170,328 Z" fill="#3F6FB0"/>
