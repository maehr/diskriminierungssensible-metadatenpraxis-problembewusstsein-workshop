<text x="0" y="384" font-size="22" font-weight="400" fill="#24303A" text-anchor="start">andere</text>
<path d="M170,358 L194.0,358 Q198.0,358 198.0,362 L198.0,394 Q198.0,398 194.0,398 L170,398 Z" fill="#3F6FB0"/>
