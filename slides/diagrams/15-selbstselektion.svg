<title id="dg15-t">Selbstselektionsverzerrung: Aufruf zur Digitalisierung von Privatarchiven</title>
<desc id="dg15-d">Zehn Familien, fünf mit hohem kulturellem Kapital und fünf marginalisierte. Auf einen Aufruf melden sich vier Familien mit hohem kulturellem Kapital und eine marginalisierte. Das digitalisierte Archiv besteht deshalb vor allem aus Beständen der ersten Gruppe.</desc>
