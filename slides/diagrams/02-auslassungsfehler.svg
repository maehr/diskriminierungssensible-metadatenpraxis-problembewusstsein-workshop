<line x1="90" y1="190" x2="290" y2="190" stroke="#24303A" stroke-width="4" stroke-linecap="round"/>
<rect x="149.0" y="172.0" width="82" height="34" rx="8" fill="#FFFFFF"/>
<text x="190.0" y="197.0" font-size="20" font-weight="600" fill="#24303A" text-anchor="middle">Brief</text>
<line x1="90" y1="410" x2="290" y2="410" stroke="#24303A" stroke-width="4" stroke-linecap="round"/>
