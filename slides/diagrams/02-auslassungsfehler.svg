<text x="190.0" y="417.0" font-size="20" font-weight="600" fill="#24303A" text-anchor="middle">Brief</text>
<line x1="90" y1="190" x2="90" y2="410" stroke="#B58A3A" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 9"/>
