<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 800 580" role="img" aria-labelledby="dg02-t dg02-d" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<title id="dg02-t">Auslassungsfehler: Netzwerk mit und ohne mündliche Kommunikation</title>
<desc id="dg02-d">Links die Realität: Personen A, B, C und D sind durch Briefe, Treffen und Gespräche verbunden. Rechts der Datensatz: Nur die Briefe A–B und C–D sind erfasst. Das Netzwerk zerfällt scheinbar in zwei getrennte Gruppen.</desc>
