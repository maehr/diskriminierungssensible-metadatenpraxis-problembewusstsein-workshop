<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 800 620" role="img" aria-labelledby="dg04-t dg04-d" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<title id="dg04-t">Aggregationsfehler: Simpson-Paradox und MAUP</title>
<desc id="dg04-d">Oben ein Balkendiagramm: In Teilgruppe 1 hat Methode Y 93 Prozent Erfolg, Methode X 87. In Teilgruppe 2 hat Y 73, X 69. Gesamt hat X 83 und Y 78. X wirkt insgesamt besser, ist aber in beiden Teilgruppen schlechter. Unten: Textilarbeiterinnen im Ruhrgebiet und Landarbeiter in Ostpreussen werden zu «Arbeiter» zusammengefasst; die Unterschiede verschwinden.</desc>
