<title id="dg18-t">Zeitliche Verzerrung: Suchanfragen nach Pandemie 2016 bis 2024</title>
<desc id="dg18-d">Ein Liniendiagramm zeigt die Suchanfragen nach «Pandemie» als Index. Von 2016 bis 2019 liegen die Werte bei 5 bis 7. 2020 springt der Wert auf 100, 2021 liegt er bei 82 und fällt danach auf 11 im Jahr 2024. Illustrative Werte.</desc>
