<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1480 510" role="img" aria-labelledby="dg00-t dg00-d" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<title id="dg00-t">Überblick: drei Familien von Bias</title>
<desc id="dg00-d">Drei nebeneinanderstehende, unverbundene Kästen: Daten mit acht Formen, Algorithmen mit zwei Formen und Nutzerinteraktion mit neun Formen. Die Formen können unabhängig voneinander auftreten.</desc>
<rect x="20" y="20" width="400" height="470" rx="18" fill="#EEF1F4"/>
<text x="48" y="72" font-size="30" font-weight="700" fill="#000000" text-anchor="start">Daten</text>
<text x="48" y="104" font-size="20" font-weight="700" fill="#8A6422" text-anchor="start" font-family="Play, Inter, sans-serif">Data Bias</text>
<text x="74" y="152" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">1</text>
<text x="88" y="152" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Messfehler</text>
<text x="74" y="188" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">2</text>
<text x="88" y="188" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Auslassungsfehler</text>
<text x="74" y="224" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">3</text>
<text x="88" y="224" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Repräsentationsfehler</text>
<text x="74" y="260" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">4</text>
<text x="88" y="260" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Aggregationsfehler</text>
<text x="74" y="296" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">5</text>
<text x="88" y="296" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Stichprobenfehler</text>
<text x="74" y="332" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">6</text>
<text x="88" y="332" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Längsschnittfehler</text>
<text x="74" y="368" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">7</text>
<text x="88" y="368" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Historische Verzerrung</text>
<text x="74" y="404" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">8</text>
<text x="88" y="404" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Populationsfehler</text>
<rect x="540" y="20" width="400" height="470" rx="18" fill="#EEF1F4"/>
<text x="568" y="72" font-size="30" font-weight="700" fill="#000000" text-anchor="start">Algorithmen</text>
<text x="568" y="104" font-size="20" font-weight="700" fill="#8A6422" text-anchor="start" font-family="Play, Inter, sans-serif">Bias in Algorithms</text>
<text x="594" y="152" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">9</text>
<text x="608" y="152" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Algorithmischer Fehler</text>
<text x="594" y="188" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">10</text>
<text x="608" y="188" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Evaluationsfehler</text>
<rect x="1060" y="20" width="400" height="470" rx="18" fill="#EEF1F4"/>
<text x="1088" y="72" font-size="30" font-weight="700" fill="#000000" text-anchor="start">Nutzerinteraktion</text>
<text x="1088" y="104" font-size="20" font-weight="700" fill="#8A6422" text-anchor="start" font-family="Play, Inter, sans-serif">User Interaction Bias</text>
<text x="1114" y="152" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">11</text>
<text x="1128" y="152" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Darstellungsfehler</text>
<text x="1114" y="188" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">12</text>
<text x="1128" y="188" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Rangfolgenfehler</text>
<text x="1114" y="224" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">13</text>
<text x="1128" y="224" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Popularitätsfehler</text>
<text x="1114" y="260" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">14</text>
<text x="1128" y="260" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Emergenter Fehler</text>
<text x="1114" y="296" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">15</text>
<text x="1128" y="296" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Selbstselektionsverzerrung</text>
<text x="1114" y="332" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">16</text>
<text x="1128" y="332" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Soziale Verzerrung</text>
<text x="1114" y="368" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">17</text>
<text x="1128" y="368" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Verhaltensverzerrung</text>
<text x="1114" y="404" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">18</text>
<text x="1128" y="404" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Zeitliche Verzerrung</text>
<text x="1114" y="440" font-size="21" font-weight="500" fill="#5F6B76" text-anchor="end">19</text>
<text x="1128" y="440" font-size="21" font-weight="400" fill="#24303A" text-anchor="start">Inhaltsproduktionsfehler</text>
</svg>
