<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 800 540" role="img" aria-labelledby="dg12-t dg12-d" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<title id="dg12-t">Rangfolgenfehler: Sortierung nach Meist betrachtet</title>
<desc id="dg12-d">Eine Trefferliste ist nach «Meist betrachtet» sortiert. Kolonialzeitliche Exponate stehen auf den Plätzen 1 bis 4 und erhalten viel Aufmerksamkeit. Neu katalogisierte Objekte aus dem Globalen Süden stehen auf den Plätzen 5 und 6 und erhalten wenig. Ein Pfeil zeigt: Was oben steht, bleibt oben.</desc>
